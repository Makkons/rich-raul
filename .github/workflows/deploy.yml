name: 🚀 Deploy to FTP Server

on:
  push:
    branches: ["main"]

# FTP-сервер не принимает второе соединение, пока идёт заливка: параллельный
# деплой падает с Timeout (control socket), поэтому ждём завершения текущего
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: app/
          server-dir: /
          exclude: |
            **/.git*
            **/.github*
            **/node_modules*
